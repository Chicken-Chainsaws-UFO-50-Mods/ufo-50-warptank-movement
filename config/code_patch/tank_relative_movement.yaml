gml_Object_o16_TankMove_Step_0:
  - type: findreplacetrim
    find: |-
          if (holdLeft)
          {
              inputDir = 180;

              if (dir >= 45 && dir <= 135)
                  goDir = -1;
              else if (dir >= 225 && dir <= 315)
                  goDir = 1;
              else if (!instance_place(x, y - 16, oBlockD3) && !instance_place(x, y - 16, oBlockD4) && !instance_place(x - 16, y + 16, oBlockD3) && !instance_place(x + 16, y + 16, oBlockD4))
                  goDir = -1;
              else
                  goDir = 1;
          }
          else if (holdRight)
          {
              inputDir = 0;

              if (dir >= 45 && dir <= 135)
                  goDir = 1;
              else if (dir >= 225 && dir <= 315)
                  goDir = -1;
              else if (!instance_place(x, y - 16, oBlockD3) && !instance_place(x, y - 16, oBlockD4) && !instance_place(x - 16, y + 16, oBlockD3) && !instance_place(x + 16, y + 16, oBlockD4))
                  goDir = 1;
              else
                  goDir = -1;
          }
          else if (holdUp)
          {
              inputDir = 90;

              if (dir >= 135 && dir <= 225)
                  goDir = 1;
              else if (dir <= 45 || dir == 315)
                  goDir = -1;
              else if (!instance_place(x + 16, y + 16, oBlockD2) && !instance_place(x + 16, y - 16, oBlockD3) && !instance_place(x - 16, y, oBlockD2) && !instance_place(x - 16, y, oBlockD3))
                  goDir = 1;
              else
                  goDir = -1;
          }
          else if (holdDown)
          {
              inputDir = 270;

              if (dir >= 135 && dir <= 225)
                  goDir = -1;
              else if (dir <= 45 || dir == 315)
                  goDir = 1;
              else if (!instance_place(x + 16, y + 16, oBlockD2) && !instance_place(x + 16, y - 16, oBlockD3) && !instance_place(x - 16, y, oBlockD2) && !instance_place(x - 16, y, oBlockD3))
                  goDir = -1;
              else
                  goDir = 1;
          }
    code: |-
      // Tank-relative movement: right on dpad always crawls right,
      // left on dpad always crawls left, regardless of orientation.
      // Up/down are ignored.
      if (holdLeft)
      {
          inputDir = 180;
          goDir = -1;
      }
      else if (holdRight)
      {
          inputDir = 0;
          goDir = 1;
      }
